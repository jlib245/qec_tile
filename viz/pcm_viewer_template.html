<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parity check matrices</title>
<style>
:root{
  --bg:#ffffff; --surface-1:#f6f7f9; --surface-2:#eceef2;
  --text:#1b1d21; --text-secondary:#5a606b; --text-muted:#8b919c;
  --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.22);
  --x:#2a78d6; --z:#eb6834;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:8px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181c; --surface-1:#1e2126; --surface-2:#272b32;
    --text:#e6e8ec; --text-secondary:#a2a9b5; --text-muted:#767d89;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.24);
    --x:#5a9df0; --z:#f2854f;
  }
}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);
     font-family:var(--font);font-size:14px;line-height:1.5}
main{max-width:1100px;margin:0 auto}
h1{font-size:17px;font-weight:600;margin:0 0 4px}
.sub{color:var(--text-secondary);font-size:13px;margin:0 0 16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 12px}
select,button{font:inherit;color:var(--text);background:var(--surface-2);
  border:1px solid var(--border);border-radius:6px;padding:5px 8px}
button{cursor:pointer}
label{font-size:13px;color:var(--text-secondary)}
input[type=range]{accent-color:var(--x)}
.val{font-family:var(--font-mono);font-size:13px;min-width:96px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
       gap:10px;margin:0 0 12px}
.card{background:var(--surface-2);border-radius:var(--radius);padding:9px 11px}
.card .lab{font-size:12px;color:var(--text-secondary)}
.card .num{font-size:19px;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px;
        font-size:12px;color:var(--text-secondary)}
.legend span.item{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:2px}
#pane{background:var(--surface-1);border-radius:12px;padding:10px;overflow:auto}
canvas{display:block;cursor:crosshair}
#readout{font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);
         margin:10px 0 0;min-height:56px;line-height:1.65}
#note{font-size:13px;color:var(--text-secondary);margin:8px 0 0}
</style>
</head>
<body>
<main>
<h1>CSS parity check matrices</h1>
<p class="sub">Built in Python by the repository's own constructors and baked in.
Click a cell to lock its row and column.</p>

<div class="controls">
  <select id="family" aria-label="code family"></select>
  <label id="paramLabel" for="param">parameter</label>
  <input type="range" id="param" min="0" max="0" value="0" style="flex:1;min-width:120px">
  <span class="val" id="paramOut"></span>
  <label for="cellSize">cell</label>
  <input type="range" id="cellSize" min="0" max="16" value="0" style="width:110px">
  <span class="val" id="cellOut">auto</span>
  <button id="clear" type="button">Clear</button>
</div>

<div class="stats" id="stats"></div>

<div class="legend">
  <span class="item"><span class="swatch" style="background:var(--x)"></span>H_X = 1</span>
  <span class="item"><span class="swatch" style="background:var(--z)"></span>H_Z = 1</span>
  <span id="hint"></span>
</div>

<div id="pane"><canvas id="cv" role="img" aria-label="parity check matrix grid"></canvas></div>

<div id="readout"></div>
<p id="note"></p>
</main>

<script>
const CODES = __PAYLOAD__;

// Group order is the catalog order; the select lists groups, the slider walks
// the entries inside one.
const GROUPS = [];
(function () {
  const seen = new Map();
  CODES.forEach(entry => {
    if (!seen.has(entry.group)) {
      const group = {name: entry.group, entries: []};
      seen.set(entry.group, group);
      GROUPS.push(group);
    }
    seen.get(entry.group).entries.push(entry);
  });
})();

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const pane = document.getElementById('pane');
const family = document.getElementById('family'), param = document.getElementById('param');
const paramOut = document.getElementById('paramOut'), paramLabel = document.getElementById('paramLabel');
const cellSize = document.getElementById('cellSize'), cellOut = document.getElementById('cellOut');

const GUTTER = 46, RULER = 22, BLOCK_GAP = 26;
let groupIndex = 0, paramIndex = 0, view = null, selected = null, hovered = null;

const current = () => GROUPS[groupIndex].entries[paramIndex];

// Smallest step from the ladder whose on-screen spacing clears `px`.
function tickStep(px, cell) {
  for (const step of [1, 2, 5, 10, 20, 25, 50, 100, 200]) {
    if (step * cell >= px) return step;
  }
  return 500;
}

const brief = list => list.length > 12
  ? list.slice(0, 12).join(', ') + ', … (' + list.length + ')'
  : (list.length ? list.join(', ') : '—');

// Row Sets and the column -> checks inverse, built once per entry.
function prepare(entry) {
  if (entry.ready) return entry;
  entry.setX = entry.X.map(row => new Set(row));
  entry.setZ = entry.Z.map(row => new Set(row));
  entry.colX = Array.from({length: entry.n}, () => []);
  entry.colZ = Array.from({length: entry.n}, () => []);
  entry.X.forEach((row, i) => row.forEach(col => entry.colX[col].push(i)));
  entry.Z.forEach((row, i) => row.forEach(col => entry.colZ[col].push(i)));
  entry.ready = true;
  return entry;
}

function showStats(entry) {
  const card = (lab, num) =>
    '<div class="card"><div class="lab">' + lab + '</div>' +
    '<div class="num">' + num + '</div></div>';
  document.getElementById('stats').innerHTML =
    card('n', entry.n) + card('k', entry.k) +
    card('H_X', entry.mx + ' x ' + entry.n) +
    card('H_Z', entry.mz + ' x ' + entry.n) +
    card('max wt', entry.wx + ' / ' + entry.wz) +
    card('CSS', entry.css ? 'ok' : 'fail');
}

// Cell size and where the two blocks sit; 0 on the slider means fit the pane.
function layout(entry) {
  const available = Math.max(240, pane.clientWidth - 20) - GUTTER - 4;
  const requested = +cellSize.value;
  const cell = requested > 0
    ? requested
    : Math.max(1, Math.min(16, Math.floor(available / entry.n)));
  cellOut.textContent = (requested > 0 ? '' : 'auto ') + cell + ' px';
  return {
    cell, n: entry.n, mx: entry.mx, mz: entry.mz,
    yX: RULER, yZ: RULER + entry.mx * cell + BLOCK_GAP,
    width: GUTTER + entry.n * cell + 4,
    height: RULER + (entry.mx + entry.mz) * cell + BLOCK_GAP + 8
  };
}

function draw() {
  const entry = current();
  view = layout(entry);
  const dpr = window.devicePixelRatio || 1;
  cv.width = view.width * dpr;
  cv.height = view.height * dpr;
  cv.style.width = view.width + 'px';
  cv.style.height = view.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, view.width, view.height);

  const css = getComputedStyle(document.documentElement);
  const varOf = (name, fallback) =>
    (css.getPropertyValue(name) || '').trim() || fallback;
  const line = varOf('--border', 'rgba(128,128,128,.2)');
  const strong = varOf('--border-strong', 'rgba(128,128,128,.4)');
  const secondary = varOf('--text-secondary', '#777');
  const muted = varOf('--text-muted', '#999');
  const cell = view.cell;

  ctx.font = '11px ' + varOf('--font-mono', 'monospace');
  ctx.textBaseline = 'middle';

  const blocks = [
    {name: 'X', y0: view.yX, m: view.mx, rows: entry.X,
     color: varOf('--x', '#2a78d6'), tint: 'rgba(42,120,214,.13)'},
    {name: 'Z', y0: view.yZ, m: view.mz, rows: entry.Z,
     color: varOf('--z', '#eb6834'), tint: 'rgba(235,104,52,.13)'}
  ];

  ctx.textAlign = 'center';
  ctx.fillStyle = muted;
  const colStep = tickStep(26, cell);
  for (let col = 0; col < entry.n; col += colStep) {
    ctx.fillText(col, GUTTER + col * cell + cell / 2, RULER - 9);
  }
  if (selected) {
    ctx.fillStyle = selected.block === 'X' ? blocks[0].color : blocks[1].color;
    ctx.fillText(selected.col, GUTTER + selected.col * cell + cell / 2, RULER - 9);
  }

  blocks.forEach(block => {
    if (!block.m) return;
    if (selected) {
      ctx.fillStyle = block.tint;
      ctx.fillRect(GUTTER + selected.col * cell, block.y0, cell, block.m * cell);
      if (selected.block === block.name) {
        ctx.fillRect(GUTTER, block.y0 + selected.row * cell, entry.n * cell, cell);
      }
    }
    if (cell >= 5) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = line;
      ctx.beginPath();
      for (let col = 0; col <= entry.n; col++) {
        const x = Math.round(GUTTER + col * cell) + .5;
        ctx.moveTo(x, block.y0); ctx.lineTo(x, block.y0 + block.m * cell);
      }
      for (let row = 0; row <= block.m; row++) {
        const y = Math.round(block.y0 + row * cell) + .5;
        ctx.moveTo(GUTTER, y); ctx.lineTo(GUTTER + entry.n * cell, y);
      }
      ctx.stroke();
      ctx.strokeStyle = strong;
      ctx.beginPath();
      for (let col = 0; col <= entry.n; col += 5) {
        const x = Math.round(GUTTER + col * cell) + .5;
        ctx.moveTo(x, block.y0); ctx.lineTo(x, block.y0 + block.m * cell);
      }
      for (let row = 0; row <= block.m; row += 5) {
        const y = Math.round(block.y0 + row * cell) + .5;
        ctx.moveTo(GUTTER, y); ctx.lineTo(GUTTER + entry.n * cell, y);
      }
      ctx.stroke();
    }

    const pad = cell >= 7 ? 1 : 0;
    ctx.fillStyle = block.color;
    block.rows.forEach((row, i) => {
      const y = block.y0 + i * cell + pad;
      row.forEach(col =>
        ctx.fillRect(GUTTER + col * cell + pad, y, cell - 2 * pad, cell - 2 * pad));
    });

    ctx.textAlign = 'right';
    ctx.fillStyle = muted;
    const rowStep = tickStep(13, cell);
    for (let row = 0; row < block.m; row += rowStep) {
      ctx.fillText(row, GUTTER - 7, block.y0 + row * cell + cell / 2);
    }
    if (selected && selected.block === block.name) {
      ctx.fillStyle = block.color;
      ctx.fillText(selected.row, GUTTER - 7, block.y0 + selected.row * cell + cell / 2);
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = secondary;
    ctx.fillText('H_' + block.name, 3, block.y0 - 10);
  });

  if (entry.dividers.length) {
    ctx.strokeStyle = secondary;
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    entry.dividers.forEach(divider => {
      const x = GUTTER + divider * cell;
      ctx.moveTo(x, view.yX); ctx.lineTo(x, view.yX + view.mx * cell);
      ctx.moveTo(x, view.yZ); ctx.lineTo(x, view.yZ + view.mz * cell);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  [selected, hovered].forEach((spot, i) => {
    if (!spot) return;
    if (i === 1 && selected && selected.block === spot.block &&
        selected.row === spot.row && selected.col === spot.col) return;
    const block = blocks.find(b => b.name === spot.block);
    ctx.strokeStyle = i === 0 ? block.color : muted;
    ctx.lineWidth = i === 0 ? 2 : 1.5;
    ctx.strokeRect(GUTTER + spot.col * cell + 1, block.y0 + spot.row * cell + 1,
                   Math.max(2, cell - 2), Math.max(2, cell - 2));
  });

  document.getElementById('hint').textContent = cell >= 5
    ? 'click a cell to lock its row and column'
    : 'cells are ' + cell + ' px at n=' + entry.n + ' — raise the cell slider to read the grid';
}

function pick(event) {
  const box = cv.getBoundingClientRect();
  const x = event.clientX - box.left - GUTTER, y = event.clientY - box.top;
  const col = Math.floor(x / view.cell);
  if (x < 0 || col < 0 || col >= view.n) return null;
  if (y >= view.yX && y < view.yX + view.mx * view.cell) {
    return {block: 'X', row: Math.floor((y - view.yX) / view.cell), col};
  }
  if (y >= view.yZ && y < view.yZ + view.mz * view.cell) {
    return {block: 'Z', row: Math.floor((y - view.yZ) / view.cell), col};
  }
  return null;
}

function say() {
  const out = document.getElementById('readout');
  const spot = selected || hovered;
  if (!spot) { out.textContent = ''; return; }
  const entry = current();
  const support = spot.block === 'X' ? entry.X[spot.row] : entry.Z[spot.row];
  const set = spot.block === 'X' ? entry.setX[spot.row] : entry.setZ[spot.row];
  out.innerHTML =
    'H_' + spot.block + '[ row ' + spot.row + ' , qubit ' + spot.col + ' ] = ' +
    (set.has(spot.col) ? 1 : 0) +
    '<br>row ' + spot.row + ' support (wt ' + support.length + '): ' + brief(support) +
    '<br>qubit ' + spot.col + ' → X-checks ' + brief(entry.colX[spot.col]) +
    '  |  Z-checks ' + brief(entry.colZ[spot.col]);
}

function refresh() {
  const entry = prepare(current());
  paramOut.textContent = entry.param;
  showStats(entry);
  document.getElementById('note').textContent = entry.note;
  selected = hovered = null;
  draw();
  say();
}

function selectGroup(index) {
  groupIndex = index;
  paramIndex = 0;
  const entries = GROUPS[groupIndex].entries;
  param.max = entries.length - 1;
  param.value = 0;
  param.disabled = entries.length === 1;
  paramLabel.textContent = entries.length === 1 ? 'only size' : 'size';
  refresh();
}

GROUPS.forEach((group, i) => {
  const option = document.createElement('option');
  option.value = i;
  option.textContent = group.name;
  family.appendChild(option);
});

family.addEventListener('change', () => selectGroup(+family.value));
param.addEventListener('input', () => { paramIndex = +param.value; refresh(); });
cellSize.addEventListener('input', draw);
cv.addEventListener('click', event => {
  const spot = pick(event);
  selected = (spot && selected && selected.block === spot.block &&
              selected.row === spot.row && selected.col === spot.col) ? null : spot;
  draw(); say();
});
cv.addEventListener('mousemove', event => {
  const spot = pick(event);
  const same = (a, b) => (!a && !b) ||
    (a && b && a.block === b.block && a.row === b.row && a.col === b.col);
  if (same(spot, hovered)) return;
  hovered = spot;
  draw(); say();
});
cv.addEventListener('mouseleave', () => { hovered = null; draw(); say(); });
document.getElementById('clear').addEventListener('click', () => {
  selected = hovered = null; draw(); say();
});
window.addEventListener('resize', draw);

selectGroup(0);
</script>
</body>
</html>
